name: Fix colony building width and height

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-width-height.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct width x height handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=[Path('index.html'),Path('forge-of-empires-colony-planner-v0.97.html')]

          old='''// Preserve the already-verified board footprints, but display dimensions in
          // the same order a player sees them on the grid: top/horizontal edge ×
          // side/vertical edge. This keeps labels consistent with the visible footprint.
          for(const era of Object.keys(ERA_DATA)){
            for(const def of eraBuildingList(era)){
              const match=String(def.sizeText||"").match(/^(\\d+)×(\\d+)$/);
              if(!match)continue;

              def.w=Number(match[1]);
              def.h=Number(match[2]);
              def.boardW=def.h;
              def.boardH=def.w;
              def.sizeText=`${def.boardW}×${def.boardH}`;
            }
          }
          '''
          new='''// Forge of Empires dimensions are always width × height.
          // ERA_DATA already stores that order, so placement and rendering preserve it.
          for(const era of Object.keys(ERA_DATA)){
            for(const def of eraBuildingList(era)){
              const match=String(def.sizeText||"").match(/^(\\d+)×(\\d+)$/);
              if(!match)continue;

              def.w=Number(match[1]);
              def.h=Number(match[2]);
              def.boardW=def.w;
              def.boardH=def.h;
              def.sizeText=`${def.w}×${def.h}`;
            }
          }
          '''

          overrides=[
          '''const SAT_HEATED_RESIDENCE=eraBuildingByKey("SAT","heatedResidence");
          if(SAT_HEATED_RESIDENCE){
            // Confirmed correction: Heated Residence occupies 3 columns × 4 rows.
            SAT_HEATED_RESIDENCE.boardW=SAT_HEATED_RESIDENCE.w;
            SAT_HEATED_RESIDENCE.boardH=SAT_HEATED_RESIDENCE.h;
            SAT_HEATED_RESIDENCE.sizeText=`${SAT_HEATED_RESIDENCE.boardW}×${SAT_HEATED_RESIDENCE.boardH}`;
          }

          ''',
          '''const SAV_INFLATABLE_HOME=eraBuildingByKey("SAV","inflatableHome");
          if(SAV_INFLATABLE_HOME){
            // Verified SAV layout: 2 tiles wide × 3 tiles tall, non-rotatable.
            SAV_INFLATABLE_HOME.boardW=2;
            SAV_INFLATABLE_HOME.boardH=3;
            SAV_INFLATABLE_HOME.sizeText="2×3";
          }

          ''',
          '''const SAJM_AQUA_CABIN=eraBuildingByKey("SAJM","aquaCabin");
          if(SAJM_AQUA_CABIN){
            // Verified in-game: Aqua Cabin is 2 tiles wide × 3 tiles tall.
            // Override the legacy width/height swap used by older planner footprints.
            SAJM_AQUA_CABIN.boardW=2;
            SAJM_AQUA_CABIN.boardH=3;
            SAJM_AQUA_CABIN.sizeText="2×3";
          }

          '''
          ]

          saab_catalog='''if(selectedEra==="SAAB"){
            result.push(
              {
                id:"builtin:early",
                name:"Movable Abodes (58)",
                kind:"Built-in",
                state:makeSaabPresetState("early")
              }
            );
          }else if(selectedEra==="SAM"){'''

          sav_catalog='''}else if(selectedEra==="SAV"){
            result.push(
              {
                id:"builtin:sav-floating-shelters",
                name:"Floating Shelters (58)",
                kind:"Built-in",
                state:makeSavPresetState("floatingShelters")
              }
            );
          }else if(selectedEra==="SAJM"){'''

          sash_catalog='''}else if(selectedEra==="SASH"){
            result.push(
              {
                id:"builtin:sash-officers",
                name:"Officers Quarters (21)",
                kind:"Built-in",
                state:makeSashPresetState("officers")
              }
            );
          }

            const custom='''

          for path in files:
              text=path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: global legacy swap not found')
              text=text.replace(old,new,1)
              for block in overrides:
                  if block not in text:
                      raise SystemExit(f'{path}: expected one-off dimension override not found')
                  text=text.replace(block,'',1)

              text,n=re.subn(
                  r'if\(selectedEra==="SAAB"\)\{.*?\n\s*\}else if\(selectedEra==="SAM"\)\{',
                  saab_catalog,text,count=1,flags=re.S
              )
              if n!=1: raise SystemExit(f'{path}: SAAB catalog section not found')

              text,n=re.subn(
                  r'\}else if\(selectedEra==="SAV"\)\{.*?\n\s*\}else if\(selectedEra==="SAJM"\)\{',
                  sav_catalog,text,count=1,flags=re.S
              )
              if n!=1: raise SystemExit(f'{path}: SAV catalog section not found')

              text,n=re.subn(
                  r'\}else if\(selectedEra==="SASH"\)\{.*?\n\s*\}\n\n\s*const custom=',
                  sash_catalog,text,count=1,flags=re.S
              )
              if n!=1: raise SystemExit(f'{path}: SASH catalog section not found')

              path.write_text(text,encoding='utf-8')
          PY

      - name: Audit all colony dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          expected={
            'SAM':{'dropPod':(2,2),'simpleShelter':(3,3),'modularHome':(5,3),'dome':(4,5),'surfaceDrill':(4,4),'chemicalMillingFacility':(4,3),'fusionPlant':(4,3),'bioTechFarm':(3,4),'microbeResearchLab':(4,4),'oxygenGenerator':(1,1),'solarPanelEast':(2,1),'solarPanelSouth':(1,2),'refinementStation':(3,4),'recombinationMachine':(2,2),'autonomousFoodDispenser':(4,4)},
            'SAAB':{'movable':(2,2),'deep':(2,3),'vaultHouse':(4,3),'spaceviewResidence':(4,4),'nickelExcavator':(6,4),'bedrockProcessor':(4,5),'asteroidDrill':(5,4),'brominePump':(4,5),'platinumQuarry':(5,5),'storageContainer':(2,2),'fuelTank':(3,2),'undergroundReactor':(2,4),'spaceWharf':(4,4)},
            'SAV':{'floatingShelter':(2,2),'inflatableHome':(3,2),'advancedApartment':(3,4),'multipurposeProperty':(5,3),'seaweedFarm':(5,4),'soyFarm':(5,4),'microgreenCapsules':(4,5),'herbGarden':(6,4),'sugarcanePlantation':(5,5),'gasTank':(2,2),'maintenanceShip':(2,3),'cargoPlatform':(4,2),'gasStation':(4,4)},
            'SAJM':{'aquaPod':(2,2),'aquaCabin':(2,3),'autonomousChambers':(4,3),'aquariusHabitat':(3,5),'redAlgaeFarm':(5,4),'spongeFarm':(4,6),'oceanarium':(4,5),'researchLaboratory':(6,4),'adventurer':(6,3),'oxygenConcentrator':(2,2),'organicOxidator':(3,2),'deepAquamarine':(2,4),'hydrographicHub':(4,4)},
            'SAT':{'igloo':(3,3),'heatedResidence':(3,4),'screenedDomicile':(4,4),'matterCompressionReactor':(6,4),'moleculeDrill':(4,6),'experimentalTestSite':(4,5),'purificationFacility':(5,4),'chemicalCleaningPlant':(6,3),'heatBatteries':(3,3),'hotChocolateBar':(3,4),'spicyTitanRestaurant':(4,4)},
            'SASH':{'simpleCrewQuarters':(3,2),'enhancedCrewQuarters':(4,3),'officersQuarters':(4,4),'crystalCrafter':(4,5),'photonosphereHarvester':(5,5),'aeroFusionPlant':(5,5),'deepSpaceDataConverter':(5,5),'fmmManufacture':(5,4),'floraShipExpress':(3,3),'cosmicCleanExpress':(4,3),'sitEatSpacePizza':(4,4)}
          }
          halls={'SAM':(6,6),'SAAB':(5,5),'SAV':(5,5),'SAJM':(5,5),'SAT':(5,5),'SASH':(7,6)}

          for path in [Path('index.html'),Path('forge-of-empires-colony-planner-v0.97.html')]:
              text=path.read_text(encoding='utf-8')
              m=re.search(r'const ERA_DATA=(\{.*?\});\nfunction eraBuildingList',text,re.S)
              assert m, f'{path}: ERA_DATA missing'
              data=json.loads(m.group(1))
              total=0
              for era,defs in expected.items():
                  assert (data[era]['townHall']['w'],data[era]['townHall']['h'])==halls[era]
                  found={d['key']:d for cat in ('residential','goods','lifeSupport') for d in data[era][cat]}
                  assert set(found)==set(defs),f'{path}: {era} building set mismatch'
                  for key,(w,h) in defs.items():
                      d=found[key]
                      assert (d['w'],d['h'])==(w,h),f'{path}: {era} {key} has {d["w"]}x{d["h"]}, expected {w}x{h}'
                      assert d['sizeText']==f'{w}×{h}',f'{path}: {era} {key} label mismatch'
                      total+=1

              assert 'def.boardW=def.w;' in text and 'def.boardH=def.h;' in text
              assert 'def.boardW=def.h;' not in text
              for removed in ('builtin:late','builtin:goods','builtin:sav-inflatable-homes','builtin:sash-simple-crew'):
                  assert f'id:"{removed}"' not in text,f'{path}: invalid preset still exposed: {removed}'
              assert 'name:"Aqua Cabins (40)"' in text

              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              app=[s for s in scripts if '"use strict"' in s]
              assert app,f'{path}: app script missing'
              Path('/tmp/'+path.name+'.js').write_text(app[-1],encoding='utf-8')
              print(f'{path}: {total} building definitions match width x height audit')
          PY

          node --check /tmp/index.html.js
          node --check /tmp/forge-of-empires-colony-planner-v0.97.html.js

      - name: Commit correction as Lacey49
        shell: bash
        run: |
          git config user.name "Lacey49"
          git config user.email "Lacey49@users.noreply.github.com"
          git rm .github/workflows/fix-width-height.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Fix colony building width and height"
          git push origin main
