name: Build standalone v0.99

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'optimizer/**'
      - 'presets/**'
      - 'site/**'
      - 'tools/build_standalone.py'
      - '.github/workflows/build-standalone.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build standalone HTML
        run: python3 tools/build_standalone.py

      - name: Commit standalone if changed
        run: |
          if git diff --quiet -- forge-of-empires-colony-planner-v0.99.html; then
            echo 'Standalone is already current.'
            exit 0
          fi
          git config user.name 'Lacey49'
          git config user.email '321159936+Lacey49@users.noreply.github.com'
          git add forge-of-empires-colony-planner-v0.99.html
          git commit -m 'Build v0.99 standalone'
          git push
