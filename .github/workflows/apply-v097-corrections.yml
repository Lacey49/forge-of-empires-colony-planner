name: Apply v0.97 corrections

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v097-corrections.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v0.97 corrections
        run: python scripts/apply_v097_corrections.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html', 'forge-of-empires-colony-planner-v0.97.html']:
              text = Path(name).read_text(encoding='utf-8')
              scripts = []
              for match in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I):
                  tag = text[match.start():text.find('>', match.start()) + 1]
                  if 'application/ld+json' not in tag:
                      scripts.append(match.group(1))
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/forge-of-empires-colony-planner-v0.97.html.js

      - name: Verify requested corrections
        run: |
          grep -q 'Website-v0.97-success' README.md
          grep -q '<meta name="keywords"' index.html
          grep -q 'Forge of Empires Colony Optimizer' index.html
          grep -q '>Delete</button>' index.html
          ! grep -q '>Erase</button>' index.html
          ! grep -q 'v0.96.1' index.html
          test -f forge-of-empires-colony-planner-v0.97.html
          test ! -e forge-of-empires-colony-planner-v0.96.1.html

      - name: Commit corrected build
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md forge-of-empires-colony-planner-v0.97.html forge-of-empires-colony-planner-v0.96.1.html
          git commit -m 'Prepare v0.97 build and restore search keywords'
          git push
