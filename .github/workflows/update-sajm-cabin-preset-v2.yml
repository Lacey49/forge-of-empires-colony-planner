name: Update SAJM Aqua Cabins preset v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-sajm-cabin-preset-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refined preset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files=[Path('index.html'),Path('forge-of-empires-colony-planner-v0.97.html')]

          old_buildings='const SAJM_AQUA_CABIN_PRESET_BUILDINGS=[[4,8],[4,17],[5,13],[6,8],[6,17],[7,13],[8,8],[8,17],[9,13],[10,8],[10,17],[11,12],[12,8],[12,20],[13,12],[13,17],[14,8],[14,21],[15,12],[15,17],[16,8],[16,21],[17,14],[17,17],[18,8],[18,21],[20,8],[20,12],[20,20],[22,8],[22,12],[22,21],[24,8],[24,12],[24,17],[24,21],[26,8],[26,12],[26,17],[26,21]];'
          new_buildings='const SAJM_AQUA_CABIN_PRESET_BUILDINGS=[[4,8],[4,17],[5,13],[6,8],[6,17],[7,13],[8,8],[8,17],[9,13],[10,8],[10,17],[11,12],[12,8],[12,17],[12,20],[13,12],[14,8],[14,21],[15,12],[15,17],[16,8],[16,21],[17,14],[17,17],[18,8],[18,21],[20,8],[20,12],[20,20],[22,8],[22,12],[22,21],[24,8],[24,12],[24,17],[24,21],[26,8],[26,12],[26,17],[26,21]];'

          old_paths='const SAJM_AQUA_CABIN_PRESET_PATHS=[[4,11],[4,12],[4,13],[4,14],[4,15],[4,16],[5,11],[5,16],[6,11],[6,16],[7,11],[7,16],[8,11],[8,16],[9,11],[9,16],[10,11],[10,16],[11,11],[12,11],[13,11],[14,11],[14,20],[15,11],[15,20],[16,11],[16,20],[17,11],[17,20],[18,11],[18,20],[19,11],[19,12],[19,13],[19,14],[19,20],[20,11],[21,11],[22,11],[23,11],[23,20],[24,11],[24,16],[24,20],[25,11],[25,20],[26,11],[26,20]];'
          new_paths='const SAJM_AQUA_CABIN_PRESET_PATHS=[[4,11],[4,12],[4,13],[4,14],[4,15],[4,16],[5,11],[5,16],[6,11],[6,16],[7,11],[7,16],[8,11],[8,16],[9,11],[9,16],[10,11],[10,16],[11,11],[12,11],[13,11],[14,11],[14,17],[14,18],[14,19],[14,20],[15,11],[15,20],[16,11],[16,20],[17,11],[17,20],[18,11],[18,20],[19,11],[19,12],[19,13],[19,14],[19,20],[20,11],[21,11],[22,11],[23,11],[23,20],[24,11],[24,16],[24,20],[25,11],[25,20],[26,11],[26,20]];'

          old_pods='const SAJM_AQUA_CABIN_PRESET_PODS=[[11,15],[17,12],[25,15]];'
          new_pods='const SAJM_AQUA_CABIN_PRESET_PODS=[[11,15],[13,15],[17,12],[25,15]];'

          for path in files:
              text=path.read_text(encoding='utf-8')
              for old,new,label in ((old_buildings,new_buildings,'cabins'),(old_paths,new_paths,'roads'),(old_pods,new_pods,'pods')):
                  if text.count(old)!=1:
                      raise SystemExit(f'Expected one {label} block in {path}, found {text.count(old)}')
                  text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          print('Updated SAJM Aqua Cabins preset to 40 cabins, 4 pods and 51 roads.')
          PY

      - name: Validate geometry
        run: |
          python3 - <<'PY'
          cabins=[[4,8],[4,17],[5,13],[6,8],[6,17],[7,13],[8,8],[8,17],[9,13],[10,8],[10,17],[11,12],[12,8],[12,17],[12,20],[13,12],[14,8],[14,21],[15,12],[15,17],[16,8],[16,21],[17,14],[17,17],[18,8],[18,21],[20,8],[20,12],[20,20],[22,8],[22,12],[22,21],[24,8],[24,12],[24,17],[24,21],[26,8],[26,12],[26,17],[26,21]]
          pods=[[11,15],[13,15],[17,12],[25,15]]
          roads={(4,11),(4,12),(4,13),(4,14),(4,15),(4,16),(5,11),(5,16),(6,11),(6,16),(7,11),(7,16),(8,11),(8,16),(9,11),(9,16),(10,11),(10,16),(11,11),(12,11),(13,11),(14,11),(14,17),(14,18),(14,19),(14,20),(15,11),(15,20),(16,11),(16,20),(17,11),(17,20),(18,11),(18,20),(19,11),(19,12),(19,13),(19,14),(19,20),(20,11),(21,11),(22,11),(23,11),(23,20),(24,11),(24,16),(24,20),(25,11),(25,20),(26,11),(26,20)}
          hub=(19,15)
          base_chunks={(1,2),(1,3),(1,4),(2,2),(2,3),(2,4),(3,2),(3,3),(3,4),(3,5),(4,2),(4,3),(4,4),(4,5),(5,2),(5,3),(5,4),(5,5),(6,2),(6,3),(6,4),(6,5)}
          land={(br*4+dr,bc*4+dc) for br,bc in base_chunks for dr in range(4) for dc in range(4)}
          def rect(r,c,w,h): return {(r+dr,c+dc) for dr in range(h) for dc in range(w)}
          def neigh(cell):
              r,c=cell
              return {(r-1,c),(r+1,c),(r,c-1),(r,c+1)}
          occupied=set(); residences=[]
          for r,c in cabins:
              cells=rect(r,c,3,2); assert cells<=land and not (cells&occupied); occupied|=cells; residences.append(cells)
          for r,c in pods:
              cells=rect(r,c,2,2); assert cells<=land and not (cells&occupied); occupied|=cells; residences.append(cells)
          hub_cells=rect(*hub,5,5); assert hub_cells<=land and not (hub_cells&occupied); occupied|=hub_cells
          assert roads<=land and not (roads&occupied); occupied|=roads
          roots={cell for cell in roads if neigh(cell)&hub_cells}; seen=set(roots); queue=list(roots)
          for cell in queue:
              for nxt in neigh(cell):
                  if nxt in roads and nxt not in seen: seen.add(nxt); queue.append(nxt)
          assert len(cabins)==40 and len(pods)==4 and len(roads)==51
          assert len(seen)==51
          assert all(any(neigh(cell)&seen for cell in cells) for cells in residences)
          assert len(land)-len(occupied)==20
          print('Validated: 40 Aqua Cabins, 4 Aqua Pods, 51 connected roads, 20 unused tiles.')
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','forge-of-empires-colony-planner-v0.97.html'):
              text=Path(name).read_text(encoding='utf-8')
              assert 'const SAJM_AQUA_CABIN_PRESET_PODS=[[11,15],[13,15],[17,12],[25,15]];' in text
              assert 'name:"Aqua Cabins (40)"' in text
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          app=[s for s in scripts if '"use strict"' in s]
          assert app
          Path('/tmp/foe.js').write_text(app[-1],encoding='utf-8')
          PY
          node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary workflow
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/update-sajm-cabin-preset-v2.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Refine SAJM Aqua Cabins preset"
          git push
