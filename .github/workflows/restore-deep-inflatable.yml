name: Restore verified Deep-Seated and Inflatable layouts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-deep-inflatable.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified dimensions and presets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=[Path('index.html'),Path('forge-of-empires-colony-planner-v0.97.html')]

          saab_old='''if(selectedEra==="SAAB"){
            result.push(
              {
                id:"builtin:early",
                name:"Movable Abodes (58)",
                kind:"Built-in",
                state:makeSaabPresetState("early")
              }
            );
          }else if(selectedEra==="SAM"){'''
          saab_new='''if(selectedEra==="SAAB"){
            result.push(
              {
                id:"builtin:early",
                name:"Movable Abodes (58)",
                kind:"Built-in",
                state:makeSaabPresetState("early")
              },
              {
                id:"builtin:late",
                name:"Deep-Seated Housing (40)",
                kind:"Built-in",
                state:makeSaabPresetState("late")
              }
            );
          }else if(selectedEra==="SAM"){'''

          sav_old='''}else if(selectedEra==="SAV"){
            result.push(
              {
                id:"builtin:sav-floating-shelters",
                name:"Floating Shelters (58)",
                kind:"Built-in",
                state:makeSavPresetState("floatingShelters")
              }
            );
          }else if(selectedEra==="SAJM"){'''
          sav_new='''}else if(selectedEra==="SAV"){
            result.push(
              {
                id:"builtin:sav-floating-shelters",
                name:"Floating Shelters (58)",
                kind:"Built-in",
                state:makeSavPresetState("floatingShelters")
              },
              {
                id:"builtin:sav-inflatable-homes",
                name:"Inflatable Homes (37)",
                kind:"Built-in",
                state:makeSavPresetState("inflatableHomes")
              }
            );
          }else if(selectedEra==="SAJM"){'''

          for path in files:
              text=path.read_text(encoding='utf-8')

              # These two footprints were directly verified against the layouts used in game.
              text,n=re.subn(
                  r'("key":"deep","name":"Deep-Seated Housing","category":"residential","sizeText":")2×3(","h":)3(,"w":)2',
                  r'\g<1>3×2\g<2>2\g<3>3',text,count=1
              )
              if n!=1: raise SystemExit(f'{path}: Deep-Seated Housing definition not found')

              text,n=re.subn(
                  r'("key":"inflatableHome","name":"Inflatable Home","category":"residential","sizeText":")3×2(","h":)2(,"w":)3',
                  r'\g<1>2×3\g<2>3\g<3>2',text,count=1
              )
              if n!=1: raise SystemExit(f'{path}: Inflatable Home definition not found')

              if saab_old not in text: raise SystemExit(f'{path}: current SAAB catalog section not found')
              text=text.replace(saab_old,saab_new,1)

              if sav_old not in text: raise SystemExit(f'{path}: current SAV catalog section not found')
              text=text.replace(sav_old,sav_new,1)

              path.write_text(text,encoding='utf-8')
          PY

      - name: Validate restored layouts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          def get_const(text,name):
              m=re.search(rf'const {re.escape(name)}=(\[[^;]+\]);',text)
              if not m: raise AssertionError(f'missing {name}')
              return json.loads(m.group(1))

          def rect(r,c,w,h):
              return {(r+dr,c+dc) for dr in range(h) for dc in range(w)}

          def validate(text,base_name,hub,items,roads):
              base=get_const(text,base_name)
              land={(r,c) for br,bc in base for r in range(br*4,br*4+4) for c in range(bc*4,bc*4+4)}
              occupied={}
              hall=rect(hub[0],hub[1],5,5)
              assert hall<=land
              for p in hall: occupied[p]='hub'
              roadset={tuple(x) for x in roads}
              assert roadset<=land
              for p in roadset:
                  assert p not in occupied,(p,'road/hub')
                  occupied[p]='road'
              for name,coords,w,h in items:
                  for r,c in coords:
                      cells=rect(r,c,w,h)
                      assert cells<=land,(name,r,c,'outside')
                      for p in cells:
                          assert p not in occupied,(name,r,c,p,occupied.get(p))
                          occupied[p]=name

              dirs=((1,0),(-1,0),(0,1),(0,-1))
              roots={p for p in roadset if any((p[0]+dr,p[1]+dc) in hall for dr,dc in dirs)}
              seen=set(roots); queue=list(roots)
              for p in queue:
                  for dr,dc in dirs:
                      q=(p[0]+dr,p[1]+dc)
                      if q in roadset and q not in seen:
                          seen.add(q); queue.append(q)
              assert seen==roadset,('disconnected roads',sorted(roadset-seen))

              for name,coords,w,h in items:
                  for r,c in coords:
                      cells=rect(r,c,w,h)
                      assert any((rr+dr,cc+dc) in seen for rr,cc in cells for dr,dc in dirs),(name,r,c,'no road')

          for path in [Path('index.html'),Path('forge-of-empires-colony-planner-v0.97.html')]:
              text=path.read_text(encoding='utf-8')

              assert re.search(r'"key":"deep".*?"sizeText":"3×2","h":2,"w":3',text)
              assert re.search(r'"key":"inflatableHome".*?"sizeText":"2×3","h":3,"w":2',text)
              assert 'id:"builtin:late"' in text
              assert 'id:"builtin:sav-inflatable-homes"' in text
              assert 'id:"builtin:goods"' not in text
              assert 'id:"builtin:sash-simple-crew"' not in text
              assert 'def.boardW=def.w;' in text and 'def.boardH=def.h;' in text
              assert 'def.boardW=def.h;' not in text

              validate(
                  text,'BASE_CHUNKS',get_const(text,'LATE_HUB'),
                  [
                    ('deep',get_const(text,'LATE_DEEP'),3,2),
                    ('movable',get_const(text,'LATE_MOVABLE'),2,2)
                  ],
                  get_const(text,'LATE_ROADS')
              )

              validate(
                  text,'SAV_BASE_CHUNKS',get_const(text,'SAV_INFLATABLE_HOME_PRESET_HUB'),
                  [
                    ('inflatableHome',get_const(text,'SAV_INFLATABLE_HOME_PRESET_BUILDINGS'),2,3),
                    ('floatingShelter',get_const(text,'SAV_INFLATABLE_HOME_PRESET_FLOATING_SHELTERS'),2,2)
                  ],
                  get_const(text,'SAV_INFLATABLE_HOME_PRESET_PATHS')
              )

              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              app=[s for s in scripts if '"use strict"' in s]
              assert app
              Path('/tmp/'+path.name+'.js').write_text(app[-1],encoding='utf-8')
              print(path,'verified')
          PY

          node --check /tmp/index.html.js
          node --check /tmp/forge-of-empires-colony-planner-v0.97.html.js

      - name: Commit correction as Lacey49
        shell: bash
        run: |
          git config user.name "Lacey49"
          git config user.email "Lacey49@users.noreply.github.com"
          git rm .github/workflows/restore-deep-inflatable.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Restore Deep-Seated and Inflatable Home layouts"
          git push origin main
