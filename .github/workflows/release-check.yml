name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run static release checker
        run: node tests/static-check.mjs

      - name: Verify unified building dimensions
        run: node tests/dimension-unification-check.mjs
