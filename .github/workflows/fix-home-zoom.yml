name: Fix homepage zoom layout leak

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-zoom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage and settings mode isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('forge-of-empires-colony-planner-v0.97.html')]
          marker = '/* Keep app screens isolated at every browser zoom / responsive breakpoint. */'
          css = "\n" + marker + "\nbody.home-mode .compact-topbar,\nbody.home-mode #compactStatus,\nbody.home-mode .main,\nbody.settings-mode .compact-topbar,\nbody.settings-mode #compactStatus,\nbody.settings-mode .main{\n  display:none!important;\n}\n"
          for path in files:
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  pos = text.rfind('</style>')
                  if pos < 0:
                      raise SystemExit(f'No closing style tag in {path}')
                  text = text[:pos] + css + '\n' + text[pos:]
                  path.write_text(text, encoding='utf-8')
          print('Added final screen-isolation CSS after all responsive rules.')
          PY

      - name: Verify CSS order and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          marker = '/* Keep app screens isolated at every browser zoom / responsive breakpoint. */'
          for name in ('index.html','forge-of-empires-colony-planner-v0.97.html'):
              text = Path(name).read_text(encoding='utf-8')
              assert text.count(marker) == 1
              assert 'body.home-mode .main' in text
              assert 'body.settings-mode .main' in text
              assert text.rfind(marker) > text.rfind('@media')
              assert text.rfind(marker) < text.rfind('</style>')
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          app = [s for s in scripts if '"use strict"' in s]
          assert app
          Path('/tmp/foe.js').write_text(app[-1], encoding='utf-8')
          print('Mode isolation verified after responsive CSS.')
          PY
          node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary workflow
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/fix-home-zoom.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Fix homepage zoom layout leak"
          git push
