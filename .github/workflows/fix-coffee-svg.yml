name: Fix coffee icon with inline SVG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-coffee-svg.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace broken image with inline SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg = '''<svg class="support-btn-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path fill="#ffbd20" d="M12 17c0-3 2-5 5-5h27c3 0 5 2 5 5v4h3c8 0 12 5 12 12 0 8-5 13-13 13h-4c-2 8-9 13-18 13h-2c-9 0-15-6-15-15V17zm37 10v13h3c4 0 6-3 6-7 0-3-2-6-6-6h-3z"/><ellipse cx="30.5" cy="17" rx="14" ry="4" fill="#111417"/></svg>'''

          for name in ('index.html', 'forge-of-empires-colony-planner-v0.97.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')

              pattern = r'(<button id="supportBtn" class="app-support-btn" type="button" title="Buy Me a Coffee" aria-label="Buy Me a Coffee">).*?(<span>Buy Me a Coffee</span></button>)'
              replacement = r'\1' + svg + r'\2'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not replace support icon in {name}')

              text = re.sub(
                  r'\.support-btn-icon\{.*?\}',
                  '.support-btn-icon{\n  width:26px!important;\n  height:26px!important;\n  min-width:26px!important;\n  display:block!important;\n  flex:0 0 26px!important;\n  overflow:visible!important;\n  visibility:visible!important;\n  opacity:1!important;\n}',
                  text,
                  count=1,
                  flags=re.S,
              )
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'forge-of-empires-colony-planner-v0.97.html'):
              text = Path(name).read_text(encoding='utf-8')
              assert '<svg class="support-btn-icon"' in text
              assert 'fill="#ffbd20"' in text
              assert '<span>Buy Me a Coffee</span>' in text
              assert 'data:image/png;base64' not in text.split('id="supportBtn"',1)[1].split('</button>',1)[0]
          print('Inline SVG coffee icon verified in both builds.')
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          app=[s for s in scripts if '"use strict"' in s]
          assert app
          Path('/tmp/foe.js').write_text(app[-1],encoding='utf-8')
          PY
          node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary workflow
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/fix-coffee-svg.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Render Buy Me a Coffee icon inline"
          git push
