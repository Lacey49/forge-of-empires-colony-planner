name: Remove invalid SAJM Aqua Cabins preset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-sajm-cabin-preset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove invalid Aqua Cabins preset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('forge-of-empires-colony-planner-v0.97.html')]
          expected_def = '"key":"aquaCabin","name":"Aqua Cabin","category":"residential","sizeText":"2×3","h":3,"w":2'
          catalog = ',\n      {\n        id:"builtin:sajm-aqua-cabins",\n        name:"Aqua Cabins (40)",\n        kind:"Built-in",\n        state:makeSajmPresetState("aquaCabins")\n      }'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if expected_def not in text:
                  raise SystemExit(f'Aqua Cabin definition is not 2 wide x 3 tall in {path}')

              text, n = re.subn(r'^const SAJM_AQUA_CABIN_PRESET_(?:HUB|BUILDINGS|PATHS|PODS)=.*?;\n', '', text, flags=re.M)
              if n != 4:
                  raise SystemExit(f'Expected 4 Aqua Cabin preset constants in {path}, removed {n}')

              text, n = re.subn(r'\n  if\(kind==="aquaCabins"\)\{.*?\n    return state;\n  \}\n', '\n', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not remove Aqua Cabin preset builder in {path}')

              if text.count(catalog) != 1:
                  raise SystemExit(f'Expected one Aqua Cabin catalog entry in {path}, found {text.count(catalog)}')
              text = text.replace(catalog, '', 1)
              path.write_text(text, encoding='utf-8')

          print('Removed invalid SAJM Aqua Cabins preset. Aqua Cabin remains 2 wide x 3 tall.')
          PY

      - name: Verify removal and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected_def = '"key":"aquaCabin","name":"Aqua Cabin","category":"residential","sizeText":"2×3","h":3,"w":2'
          for name in ('index.html','forge-of-empires-colony-planner-v0.97.html'):
              text = Path(name).read_text(encoding='utf-8')
              assert expected_def in text
              assert 'builtin:sajm-aqua-cabins' not in text
              assert 'Aqua Cabins (40)' not in text
              assert 'SAJM_AQUA_CABIN_PRESET_' not in text
              assert 'makeSajmPresetState("aquaCabins")' not in text
              assert 'builtin:sajm-aqua-pods' in text

          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          app = [s for s in scripts if '"use strict"' in s]
          assert app
          Path('/tmp/foe.js').write_text(app[-1], encoding='utf-8')
          print('Preset removed and Aqua Cabin 2x3 definition verified.')
          PY
          node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary workflow
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/remove-sajm-cabin-preset.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Remove invalid SAJM Aqua Cabins preset"
          git push
