name: Update SAJM Aqua Cabins preset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-sajm-cabin-preset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply preset update
        run: python3 scripts/apply_sajm_cabin_preset.py

      - name: Check JavaScript syntax
        run: node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary files
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/update-sajm-cabin-preset.yml scripts/apply_sajm_cabin_preset.py
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Update SAJM Aqua Cabins preset"
          git push
