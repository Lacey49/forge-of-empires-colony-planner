name: One-time index cache fix

on:
  push:
    paths:
      - '.github/workflows/one-time-index-cache-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update static version and loader cache key
        run: |
          sed -i 's/Forge of Empires Colony Planner v0\.98/Forge of Empires Colony Planner v0.99/g' index.html
          sed -i 's/>v0\.98</>v0.99</g' index.html
          sed -i 's#./assets/js/optimizer.js?v=5#./assets/js/optimizer.js?v=6#g' index.html

      - name: Run static checker
        run: node tests/static-check.mjs

      - name: Commit patch
        run: |
          git config user.name 'Lacey49'
          git config user.email 'gridleykasey@gmail.com'
          git add index.html
          git commit -m 'Refresh live planner version and loader cache key'
          git push
