name: Fix SAJM Aqua Cabin orientation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sajm-aqua-cabin-orientation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Aqua Cabin board orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('forge-of-empires-colony-planner-v0.97.html')]
          anchor = 'const BUILDINGS={'
          addition = 'const SAJM_AQUA_CABIN=eraBuildingByKey("SAJM","aquaCabin");\nif(SAJM_AQUA_CABIN){\n  // Verified in-game: Aqua Cabin is 2 tiles wide × 3 tiles tall.\n  // Override the legacy width/height swap used by older planner footprints.\n  SAJM_AQUA_CABIN.boardW=2;\n  SAJM_AQUA_CABIN.boardH=3;\n  SAJM_AQUA_CABIN.sizeText="2×3";\n}\n\n'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'const SAJM_AQUA_CABIN=eraBuildingByKey("SAJM","aquaCabin");' in text:
                  raise SystemExit(f'Aqua Cabin override already exists in {path}')
              if anchor not in text:
                  raise SystemExit(f'Insertion anchor not found in {path}')
              text = text.replace(anchor, addition + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify rendered board dimensions and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          required = 'SAJM_AQUA_CABIN.boardW=2;\n  SAJM_AQUA_CABIN.boardH=3;\n  SAJM_AQUA_CABIN.sizeText="2×3";'
          for name in ('index.html','forge-of-empires-colony-planner-v0.97.html'):
              text = Path(name).read_text(encoding='utf-8')
              assert required in text
              assert 'builtin:sajm-aqua-cabins' not in text
              assert 'Aqua Cabins (40)' not in text
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          app = [s for s in scripts if '"use strict"' in s]
          assert app
          Path('/tmp/foe.js').write_text(app[-1], encoding='utf-8')
          print('Aqua Cabin board footprint verified as 2 wide x 3 tall.')
          PY
          node --check /tmp/foe.js

      - name: Commit as Lacey49 and remove temporary workflow
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"
          git rm .github/workflows/fix-sajm-aqua-cabin-orientation.yml
          git add index.html forge-of-empires-colony-planner-v0.97.html
          git commit -m "Fix SAJM Aqua Cabin orientation"
          git push
