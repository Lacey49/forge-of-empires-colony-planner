name: Rewrite history to owner only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rewrite-history-owner-only.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite all main-branch commit identities
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          git config user.name "Lacey49"
          git config user.email "gridleykasey@gmail.com"

          git filter-branch -f --env-filter '
            export GIT_AUTHOR_NAME="Lacey49"
            export GIT_AUTHOR_EMAIL="gridleykasey@gmail.com"
            export GIT_COMMITTER_NAME="Lacey49"
            export GIT_COMMITTER_EMAIL="gridleykasey@gmail.com"
          ' main

      - name: Remove this one-time workflow
        run: |
          git rm .github/workflows/rewrite-history-owner-only.yml
          git commit -m "Remove one-time history rewrite workflow"

      - name: Verify rewritten history
        run: |
          bad=$(git log main --format='%an <%ae>|%cn <%ce>' | grep -v '^Lacey49 <gridleykasey@gmail.com>|Lacey49 <gridleykasey@gmail.com>$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected commit identity remains:"
            echo "$bad"
            exit 1
          fi
          if git log main --format='%an %ae %cn %ce' | grep -qi 'github-actions'; then
            echo "github-actions identity still exists in rewritten main history"
            exit 1
          fi
          echo "All reachable main commits are authored and committed by Lacey49."

      - name: Force-push cleaned main history
        run: git push --force origin main
