name: One-time settings recovery patch

on:
  push:
    paths:
      - '.github/workflows/one-time-settings-recovery.yml'
      - 'tools/one-time-settings-recovery-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch settings recovery UI
        run: python tools/one-time-settings-recovery-patch.py

      - name: Run static checker
        run: node tests/static-check.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Lacey49'
          git config user.email 'gridleykasey@gmail.com'
          git add index.html site/storage-recovery.js assets/js/optimizer.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Render backup recovery settings immediately'
          git push
