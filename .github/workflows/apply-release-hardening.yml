name: Apply v0.96.1 release hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-release-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply release hardening
        run: python scripts/apply_release_hardening.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for match in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I):
              tag = text[match.start():text.find('>', match.start()) + 1]
              if 'application/ld+json' not in tag:
                  scripts.append(match.group(1))
          Path('/tmp/planner-check.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/planner-check.js

      - name: Verify release markers
        run: |
          grep -q 'v0.96.1' index.html
          grep -q 'compactEraseBtn' index.html
          grep -q 'viewport-safe layout' index.html
          grep -q 'Current website build.*v0.96.1' README.md
          test -f forge-of-empires-colony-planner-v0.96.1.html

      - name: Commit hardened site
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md forge-of-empires-colony-planner-v0.96.1.html
          git commit -m 'Harden v0.96.1 release'
          git push
