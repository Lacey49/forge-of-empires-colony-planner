name: Cleanup asset names and dimension labels

on:
  push:
    branches: [main]
    paths:
      - scripts/cleanup_asset_names_and_labels.py
      - scripts/run_asset_cleanup.py
      - scripts/prune_legacy_asset_gallery.py
      - .github/workflows/cleanup-assets-and-labels.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Keep labels and asset references normalized
        run: python3 scripts/run_asset_cleanup.py

      - name: Remove obsolete anonymous gallery assets
        run: python3 scripts/prune_legacy_asset_gallery.py

      - name: Verify asset references and names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html').read_text(encoding='utf-8')
          assert 'assets/generated/' not in index
          assert 'assets/building-assets/' in index
          assert 'const ERA_ASSETS=' not in index
          assert 'SAAB_GALLERY_ASSETS' not in index
          assert 'spriteSourceSection' not in index
          assert 'def.sizeText=`${def.boardW}×${def.boardH}`;' in index
          assert 'SAV_INFLATABLE_HOME.sizeText="2×3";' in index
          assert 'SAT_HEATED_RESIDENCE.sizeText=`${SAT_HEATED_RESIDENCE.boardW}×${SAT_HEATED_RESIDENCE.boardH}`;' in index
          refs = set(re.findall(r'\./assets/building-assets/([A-Za-z0-9._-]+)', index))
          assert refs
          missing = [name for name in refs if not (Path('assets/building-assets') / name).is_file()]
          assert not missing, missing
          hashed = [name for name in refs if re.fullmatch(r'[0-9a-f]{16,}\.(?:png|webp|jpg|jpeg|gif)', name, re.I)]
          assert not hashed, hashed
          vague = [name for name in refs if re.search(r'(?:^|-)asset\d+|goods\d+|residential\d+|lifesupport\d+', name)]
          assert not vague, vague
          generated = Path('assets/generated')
          assert not generated.exists() or not any(generated.iterdir())
          existing = {p.name for p in Path('assets/building-assets').iterdir() if p.is_file() and p.name != 'README.md'}
          assert existing == refs, (sorted(existing - refs), sorted(refs - existing))
          print(f'Verified {len(refs)} referenced human-readable asset files and no anonymous leftovers.')
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          app = [s for s in scripts if '"use strict"' in s]
          assert app, 'Application script not found'
          Path('/tmp/foe-planner.js').write_text(app[-1], encoding='utf-8')
          PY
          node --check /tmp/foe-planner.js

      - name: Verify physical footprint compatibility remains
        run: |
          grep -F 'def.boardW=def.h;' index.html
          grep -F 'def.boardH=def.w;' index.html
          grep -F 'SAT_HEATED_RESIDENCE.boardW=SAT_HEATED_RESIDENCE.w;' index.html
          grep -F 'SAT_HEATED_RESIDENCE.boardH=SAT_HEATED_RESIDENCE.h;' index.html

      - name: Commit cleanup
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Remove anonymous legacy asset gallery"
          git push
